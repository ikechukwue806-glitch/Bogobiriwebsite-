===================== --><!DOCTYPE html><html lang="en">
<head>

            border-radius: 5px;

            padding: 40px;
            text-align: center;
        }

            background: #111;
            color: white;
            text-align: center;

    <h2>Bogobiri Hotel</h2>

FILE 2: booking.html
===================== --><!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Room - Bogobiri Hotel</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 40px;
            max-width: 500px;
            margin: auto;
            background: white;
            margin-top: 40px;
            border-radius: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: gold;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #111;
        }
    </style>
</head>
<body><header>
    <h2>Book Your Room</h2>
</header><div class="container">
    <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <select required>
            <option value="">Select Room Type</option>
            <option>Standard Room</option>
            <option>Deluxe Room</option>
            <option>Suite</option>
        </select>
        <input type="date" required>
        <button type="submit">Confirm Booking</button>
    </form><a href="index.html">← Back to Home</a>

</div></body>
</html>
